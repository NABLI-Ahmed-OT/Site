<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Memory Lights & Sounds</title>
<style>
  :root{
    --bg1:#070b18;
    --bg2:#121d3b;
    --panel:#111827;
    --text:#f7fbff;
    --muted:#a8b3cf;
    --cyan:#55dfff;
    --danger:#ff4f67;
    --success:#67f19b;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% 18%, rgba(60,120,255,.20), transparent 28%),
      radial-gradient(circle at 20% 70%, rgba(0,230,255,.10), transparent 35%),
      linear-gradient(145deg,var(--bg2),var(--bg1) 58%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
  }

  .app{
    width:min(980px,100%);
    min-height:100%;
    padding:18px;
    display:grid;
    grid-template-columns:minmax(280px,620px) minmax(230px,310px);
    gap:22px;
    align-items:center;
    justify-content:center;
  }

  .game-column{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .title{
    margin:0;
    text-align:center;
    font-size:clamp(28px,5vw,48px);
    line-height:1;
    letter-spacing:.05em;
    text-transform:uppercase;
    text-shadow:0 0 18px rgba(86,220,255,.4);
  }

  .subtitle{
    margin:2px 0 0;
    color:var(--muted);
    text-align:center;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
  }

  .status{
    min-height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-weight:800;
    text-align:center;
  }

  .status-dot{
    width:10px;height:10px;border-radius:50%;
    background:#74809b;
    box-shadow:0 0 12px currentColor;
  }

  .device{
    position:relative;
    width:min(86vw,560px);
    aspect-ratio:1;
    border-radius:50%;
    padding:8.5%;
    background:
      radial-gradient(circle at 45% 38%, #263044 0 8%, #121823 44%, #05070d 72%);
    box-shadow:
      0 28px 55px rgba(0,0,0,.55),
      inset 0 0 0 8px #05070b,
      inset 0 0 0 12px #222c3c,
      0 0 45px rgba(40,160,255,.15);
    user-select:none;
    touch-action:manipulation;
  }

  .pads{
    width:100%;height:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:5.5%;
    transform:rotate(0deg);
  }

  .pad{
    border:0;
    cursor:pointer;
    position:relative;
    filter:saturate(.92) brightness(.72);
    transition:transform .08s ease,filter .08s ease,box-shadow .08s ease;
    box-shadow:
      inset 0 -12px 20px rgba(0,0,0,.28),
      inset 0 4px 10px rgba(255,255,255,.15),
      0 5px 10px rgba(0,0,0,.4);
  }
  .pad:active{transform:scale(.97)}
  .pad:disabled{cursor:default}

  .pad::after{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:inherit;
    background:linear-gradient(140deg,rgba(255,255,255,.17),transparent 42%);
    pointer-events:none;
  }

  .pad.red{
    background:#f2262f;
    border-radius:100% 18% 18% 18%;
  }
  .pad.blue{
    background:#29b9ff;
    border-radius:18% 100% 18% 18%;
  }
  .pad.green{
    background:#87ef1e;
    border-radius:18% 18% 18% 100%;
  }
  .pad.yellow{
    background:#ffc528;
    border-radius:18% 18% 100% 18%;
  }

  .pad.active{
    filter:saturate(1.35) brightness(1.45);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,.45),
      0 0 30px currentColor,
      0 0 60px currentColor;
    transform:scale(1.025);
  }

  .center{
    position:absolute;
    inset:31.5%;
    border-radius:50%;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
      radial-gradient(circle at 40% 30%, #293244, #10141e 58%, #05070b);
    border:clamp(6px,1.5vw,11px) solid #05070b;
    box-shadow:
      0 8px 18px rgba(0,0,0,.55),
      inset 0 0 0 2px #364052,
      inset 0 0 22px rgba(0,0,0,.8);
  }

  .center-logo{
    font-weight:1000;
    font-size:clamp(13px,2.8vw,24px);
    line-height:.95;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .round-display{
    margin-top:10px;
    min-width:52px;
    padding:4px 8px;
    border-radius:8px;
    color:#ff6c7e;
    background:#19060a;
    border:1px solid #53212a;
    box-shadow:inset 0 0 12px rgba(255,0,44,.18);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(13px,2vw,19px);
    font-weight:900;
  }

  .controls{
    background:rgba(14,20,35,.86);
    border:1px solid rgba(125,165,255,.18);
    box-shadow:0 18px 45px rgba(0,0,0,.38);
    border-radius:24px;
    padding:18px;
    backdrop-filter:blur(18px);
  }

  .controls h2{
    margin:0 0 14px;
    font-size:20px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
  }

  .stat{
    padding:11px;
    border-radius:14px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
  }
  .stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
  .stat strong{display:block;font-size:22px;margin-top:2px}

  .row{margin:13px 0}
  label{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#dce6ff;margin-bottom:7px}
  select,input[type="range"]{width:100%}

  select{
    padding:11px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    color:white;
    background:#182135;
    outline:none;
  }

  input[type="range"]{accent-color:var(--cyan)}

  .toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-top:1px solid rgba(255,255,255,.06);
  }

  .switch{
    position:relative;
    width:48px;height:27px;
  }
  .switch input{opacity:0;width:0;height:0}
  .slider{
    position:absolute;inset:0;border-radius:999px;
    background:#30394b;cursor:pointer;transition:.2s;
  }
  .slider::before{
    content:"";
    position:absolute;width:21px;height:21px;left:3px;top:3px;
    border-radius:50%;background:white;transition:.2s;
  }
  .switch input:checked + .slider{background:#1da3c7}
  .switch input:checked + .slider::before{transform:translateX(21px)}

  .buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
  }

  .btn{
    border:0;
    border-radius:14px;
    padding:13px 14px;
    font-weight:900;
    cursor:pointer;
    color:#071016;
    background:linear-gradient(135deg,#7ef1ff,#33b9ff);
    box-shadow:0 9px 22px rgba(40,180,255,.22);
  }
  .btn.secondary{
    color:#e9efff;
    background:#253047;
    box-shadow:none;
  }
  .btn:disabled{opacity:.5;cursor:default}

  .help{
    margin:14px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
  }

  .toast{
    position:fixed;
    left:50%;bottom:20px;
    transform:translate(-50%,120px);
    padding:12px 17px;
    border-radius:999px;
    background:#111827;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 35px rgba(0,0,0,.4);
    font-weight:800;
    transition:.25s;
    z-index:20;
  }
  .toast.show{transform:translate(-50%,0)}

  @media(max-width:780px){
    body{align-items:flex-start}
    .app{
      grid-template-columns:1fr;
      padding:14px;
    }
    .controls{width:min(560px,100%);margin:auto}
  }

  @media(max-width:420px){
    .app{gap:12px}
    .device{width:92vw}
    .center{inset:30.5%}
    .controls{border-radius:18px}
  }
</style>
</head>
<body>
<main class="app">
  <section class="game-column">
    <header>
      <h1 class="title">Memory Game</h1>
      <p class="subtitle">Lights & Sounds</p>
    </header>

    <div class="status" aria-live="polite">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Press Start</span>
    </div>

    <div class="device" aria-label="Memory game device">
      <div class="pads">
        <button class="pad red" data-pad="0" aria-label="Red pad"></button>
        <button class="pad blue" data-pad="1" aria-label="Blue pad"></button>
        <button class="pad green" data-pad="2" aria-label="Green pad"></button>
        <button class="pad yellow" data-pad="3" aria-label="Yellow pad"></button>
      </div>

      <div class="center">
        <div class="center-logo">Memory<br>Game</div>
        <div class="round-display" id="roundDisplay">--</div>
      </div>
    </div>
  </section>

  <aside class="controls">
    <h2>Game Settings</h2>

    <div class="stats">
      <div class="stat"><span>Round</span><strong id="roundStat">0</strong></div>
      <div class="stat"><span>Best</span><strong id="bestStat">0</strong></div>
      <div class="stat"><span>Score</span><strong id="scoreStat">0</strong></div>
      <div class="stat"><span>Lives</span><strong id="livesStat">3</strong></div>
    </div>

    <div class="row">
      <label for="difficulty"><span>Difficulty</span></label>
      <select id="difficulty">
        <option value="easy">Easy — slow sequence</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard — faster sequence</option>
        <option value="expert">Expert — very fast</option>
      </select>
    </div>

    <div class="row">
      <label for="volume"><span>Sound volume</span><strong id="volumeValue">70%</strong></label>
      <input id="volume" type="range" min="0" max="100" value="70">
    </div>

    <div class="toggle">
      <span>Strict mode</span>
      <label class="switch">
        <input id="strictMode" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle">
      <span>Haptic feedback</span>
      <label class="switch">
        <input id="haptics" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="buttons">
      <button class="btn" id="startBtn">Start Game</button>
      <button class="btn secondary" id="resetBtn">Reset</button>
    </div>

    <p class="help">
      Watch the light sequence, then repeat it by tapping the colored pads.
      Each round adds one new step. Keyboard: <b>1</b> red, <b>2</b> blue,
      <b>3</b> green, <b>4</b> yellow.
    </p>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  const pads = [...document.querySelectorAll('.pad')];
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const difficulty = document.getElementById('difficulty');
  const strictMode = document.getElementById('strictMode');
  const haptics = document.getElementById('haptics');
  const volume = document.getElementById('volume');
  const volumeValue = document.getElementById('volumeValue');
  const roundDisplay = document.getElementById('roundDisplay');
  const roundStat = document.getElementById('roundStat');
  const bestStat = document.getElementById('bestStat');
  const scoreStat = document.getElementById('scoreStat');
  const livesStat = document.getElementById('livesStat');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const toast = document.getElementById('toast');

  const frequencies = [261.63, 329.63, 392.00, 523.25];
  const speedMap = {
    easy:   {on: 620, gap: 230},
    normal: {on: 430, gap: 170},
    hard:   {on: 290, gap: 115},
    expert: {on: 190, gap: 80}
  };

  let ctx = null;
  let sequence = [];
  let inputIndex = 0;
  let acceptingInput = false;
  let playingSequence = false;
  let activeGame = false;
  let score = 0;
  let lives = 3;
  let best = Number(localStorage.getItem('memoryGameBest') || 0);
  let runId = 0;

  bestStat.textContent = best;

  function ensureAudio(){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }

  function beep(index, duration = 0.28, type = 'sine'){
    ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    const vol = Number(volume.value) / 100;

    osc.type = type;
    osc.frequency.setValueAtTime(frequencies[index], now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol * 0.24), now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function errorSound(){
    ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    const vol = Number(volume.value) / 100;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.35);
    gain.gain.setValueAtTime(vol * 0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(now + 0.42);
  }

  function setStatus(text, color = '#74809b'){
    statusText.textContent = text;
    statusDot.style.background = color;
    statusDot.style.color = color;
  }

  function updateStats(){
    const round = sequence.length;
    roundDisplay.textContent = activeGame ? String(round).padStart(2,'0') : '--';
    roundStat.textContent = round;
    scoreStat.textContent = score;
    livesStat.textContent = strictMode.checked ? '1' : lives;
    bestStat.textContent = best;
  }

  function pulsePad(index, duration = 260){
    const pad = pads[index];
    pad.classList.add('active');
    beep(index, duration / 1000 * 0.8);
    setTimeout(() => pad.classList.remove('active'), duration);
  }

  function vibrate(pattern){
    if (haptics.checked && navigator.vibrate) navigator.vibrate(pattern);
  }

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function playSequence(){
    const localRun = runId;
    playingSequence = true;
    acceptingInput = false;
    setStatus('Watch the sequence', '#55dfff');
    pads.forEach(p => p.disabled = true);

    await wait(500);
    const timing = speedMap[difficulty.value];

    for (const step of sequence){
      if (localRun !== runId || !activeGame) return;
      pulsePad(step, timing.on);
      await wait(timing.on + timing.gap);
    }

    if (localRun !== runId || !activeGame) return;
    inputIndex = 0;
    playingSequence = false;
    acceptingInput = true;
    pads.forEach(p => p.disabled = false);
    setStatus('Your turn', '#67f19b');
  }

  function addStep(){
    sequence.push(Math.floor(Math.random() * 4));
    updateStats();
  }

  async function beginRound(){
    addStep();
    await playSequence();
  }

  async function startGame(){
    ensureAudio();
    runId++;
    sequence = [];
    inputIndex = 0;
    score = 0;
    lives = strictMode.checked ? 1 : 3;
    activeGame = true;
    acceptingInput = false;
    startBtn.textContent = 'Restart';
    updateStats();
    setStatus('Get ready', '#ffcf4d');
    await wait(600);
    beginRound();
  }

  function endGame(){
    activeGame = false;
    acceptingInput = false;
    playingSequence = false;
    pads.forEach(p => p.disabled = true);
    runId++;
    roundDisplay.textContent = '--';
    setStatus('Game over — press Start', '#ff4f67');
    errorSound();
    vibrate([120,70,180]);

    if(sequence.length > best){
      best = sequence.length;
      localStorage.setItem('memoryGameBest', best);
      showToast('New best: ' + best + ' rounds!');
    } else {
      showToast('Final score: ' + score);
    }
    updateStats();
  }

  async function correctSequence(){
    acceptingInput = false;
    pads.forEach(p => p.disabled = true);
    const bonus = sequence.length * 100;
    score += bonus;

    if(sequence.length > best){
      best = sequence.length;
      localStorage.setItem('memoryGameBest', best);
    }

    updateStats();
    setStatus('Correct! +' + bonus, '#67f19b');
    vibrate(45);
    await wait(850);
    if(activeGame) beginRound();
  }

  async function wrongInput(){
    acceptingInput = false;
    pads.forEach(p => p.disabled = true);
    errorSound();
    vibrate([90,55,90]);
    score = Math.max(0, score - 50);

    if(strictMode.checked){
      lives = 0;
      updateStats();
      endGame();
      return;
    }

    lives--;
    updateStats();

    if(lives <= 0){
      endGame();
      return;
    }

    setStatus('Wrong — watch again', '#ffcf4d');
    await wait(900);
    if(activeGame) playSequence();
  }

  function handlePad(index){
    if(!activeGame || !acceptingInput || playingSequence) return;

    pulsePad(index, 210);
    vibrate(22);

    if(index === sequence[inputIndex]){
      inputIndex++;
      score += 10;
      updateStats();

      if(inputIndex === sequence.length) correctSequence();
    } else {
      wrongInput();
    }
  }

  function resetGame(){
    runId++;
    activeGame = false;
    acceptingInput = false;
    playingSequence = false;
    sequence = [];
    inputIndex = 0;
    score = 0;
    lives = strictMode.checked ? 1 : 3;
    pads.forEach(p => {
      p.disabled = false;
      p.classList.remove('active');
    });
    startBtn.textContent = 'Start Game';
    setStatus('Press Start', '#74809b');
    updateStats();
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  pads.forEach((pad,index) => {
    pad.addEventListener('pointerdown', () => handlePad(index));
  });

  document.addEventListener('keydown', e => {
    const map = {'1':0,'2':1,'3':2,'4':3};
    if(map[e.key] !== undefined) handlePad(map[e.key]);
    if(e.code === 'Space'){
      e.preventDefault();
      startGame();
    }
  });

  startBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', resetGame);

  volume.addEventListener('input', () => {
    volumeValue.textContent = volume.value + '%';
  });

  strictMode.addEventListener('change', () => {
    if(!activeGame){
      lives = strictMode.checked ? 1 : 3;
      updateStats();
    }
  });

  resetGame();
})();
</script>
</body>
</html>
