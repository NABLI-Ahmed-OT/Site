<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Head Tilt Racer</title><style>
*{box-sizing:border-box}body{margin:0;background:#080511;color:#fff;font-family:monospace}.app{max-width:820px;margin:auto;padding:10px}h1{text-align:center;color:#ffe45c;text-shadow:3px 3px #7b1f77;font-size:clamp(20px,5vw,34px);margin:4px}.sub{text-align:center;color:#bca8ce;font-size:12px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.hud div{background:#160e27;border:2px solid #40f8ff;padding:7px;text-align:center}.hud b{display:block;color:#ffe45c;font-size:18px}.hud span{font-size:10px;color:#bca8ce}.game{position:relative;aspect-ratio:3/4;max-height:72dvh;border:3px solid #ff4fd8;overflow:hidden;background:#05030b;touch-action:none}canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated}video,#face{position:absolute;right:8px;bottom:8px;width:25%;max-width:145px;aspect-ratio:3/4;object-fit:cover;transform:scaleX(-1);border:2px solid #40f8ff;z-index:3;background:#000}#face{z-index:4;pointer-events:none}.status,.msg{position:absolute;left:50%;transform:translateX(-50%);z-index:5;background:#05030bcc;padding:8px 10px;border:2px solid #40f8ff;text-align:center}.status{top:8px;font-size:11px}.msg{bottom:48px;border-color:#ffe45c;color:#ffe45c;font-weight:bold}.meter{position:absolute;left:8px;bottom:8px;width:42%;height:18px;background:#24103a;border:2px solid #ff4fd8;z-index:5}.meter:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffe45c}.dot{position:absolute;top:3px;left:50%;width:8px;height:8px;background:#40f8ff;transform:translateX(-50%)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}button{min-height:48px;background:#21143b;color:#fff;border:2px solid #40f8ff;font:700 12px monospace}.primary{background:#ff4fd8;color:#130518;border-color:#ffe45c}.sliders,.touch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.box{background:#160e27;border:2px solid #4c2a6b;padding:8px;font-size:11px}.box label{display:flex;justify-content:space-between;color:#bca8ce}input{width:100%}.hint{text-align:center;color:#bca8ce;font-size:10px;line-height:1.4}@media(max-width:560px){.hud{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}.controls button:last-child{grid-column:span 2}}
</style></head><body><main class="app"><h1>NEON HEAD-TILT RACER</h1><p class="sub">Tilt your head left and right to avoid obstacles.</p><section class="hud"><div><b id="score">000000</b><span>SCORE</span></div><div><b id="best">000000</b><span>BEST</span></div><div><b id="speed">100</b><span>SPEED</span></div><div><b id="dist">0.0</b><span>KM</span></div></section><section class="game" id="shell"><canvas id="game"></canvas><video id="video" autoplay muted playsinline></video><canvas id="face"></canvas><div class="status" id="status">START CAMERA OR USE TOUCH</div><div class="msg" id="msg">PRESS START ENGINE</div><div class="meter"><div class="dot" id="dot"></div></div></section><section class="controls"><button id="cam">START CAMERA</button><button id="cal">CALIBRATE HEAD</button><button class="primary" id="start">START ENGINE</button></section><section class="sliders"><div class="box"><label>SENSITIVITY <span id="sv">1.6×</span></label><input id="sens" type="range" min=".7" max="3" step=".1" value="1.6"></div><div class="box"><label>MUSIC <span id="mv">45%</span></label><input id="vol" type="range" min="0" max="1" step=".05" value=".45"></div></section><section class="touch"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></section><p class="hint">Original browser-generated retro chiptune. Camera access usually requires HTTPS or localhost.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d'),shell=document.getElementById('shell'),v=document.getElementById('video'),fc=document.getElementById('face'),fx=fc.getContext('2d');const E=id=>document.getElementById(id);let run=0,last=0,t=0,score=0,best=0,dist=0,spd=.42,obs=[],spawn=0,px=0,target=0,head=0,neutral=0,sens=1.6,touch=0,camObj,mesh,audio,master,timer,step=0;
function resize(){let r=shell.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}
function hud(){E('score').textContent=Math.floor(score).toString().padStart(6,'0');E('best').textContent=Math.floor(best).toString().padStart(6,'0');E('speed').textContent=Math.floor(100+spd*220);E('dist').textContent=dist.toFixed(1)}
function road(y,h,w){let H=h*.28,q=Math.max(0,Math.min(1,(y-H)/(h-H))),half=w*(.08+q*.43);return{l:w/2-half,r:w/2+half}}
function proj(nx,z){let r=shell.getBoundingClientRect(),w=r.width,h=r.height,H=h*.28,p=Math.pow(1-z,1.7),y=H+p*(h-H),e=road(y,h,w);return{x:(e.l+e.r)/2+nx*(e.r-e.l)*.43,y,scale:.18+p*1.22}}
function draw(){let r=shell.getBoundingClientRect(),w=r.width,h=r.height,g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#100022');g.addColorStop(.55,'#2c0b56');g.addColorStop(1,'#ff4fd8');x.fillStyle=g;x.fillRect(0,0,w,h);let H=h*.28;x.fillStyle='#ffe45c';x.beginPath();x.arc(w/2,H-h*.07,Math.min(w,h)*.11,Math.PI,0);x.fill();let b=road(h,h,w),a=road(H,h,w);x.fillStyle='#17131f';x.beginPath();x.moveTo(a.l,H);x.lineTo(a.r,H);x.lineTo(b.r,h);x.lineTo(b.l,h);x.closePath();x.fill();x.strokeStyle='#40f8ff';x.lineWidth=3;x.beginPath();x.moveTo(a.l,H);x.lineTo(b.l,h);x.moveTo(a.r,H);x.lineTo(b.r,h);x.stroke();let off=(t*spd*1.7)%1;for(let i=0;i<14;i++){let z=(i/14+off)%1,p=proj(0,z);x.fillStyle=i%2?'#ffe45c':'#fff';x.fillRect(p.x-2*p.scale,p.y,4*p.scale,8*p.scale)}[...obs].sort((A,B)=>B.z-A.z).forEach(o=>{let p=proj(o.x,o.z),s=42*p.scale;x.fillStyle=o.type?'#ff465d':'#ff8a2a';if(o.type){x.fillRect(p.x-s*.42,p.y-s*.48,s*.84,s*.48);x.fillStyle='#8ee8ff';x.fillRect(p.x-s*.24,p.y-s*.39,s*.48,s*.15)}else{x.beginPath();x.moveTo(p.x,p.y-s*.45);x.lineTo(p.x-s*.25,p.y);x.lineTo(p.x+s*.25,p.y);x.closePath();x.fill()}});let p=proj(px,.015),W=Math.min(w,h)*.14,Hc=W*1.35;x.fillStyle='#40f8ff';x.fillRect(p.x-W*.42,p.y-Hc*.56,W*.84,Hc*.5);x.fillStyle='#ff4fd8';x.fillRect(p.x-W*.48,p.y-Hc*.24,W*.96,Hc*.2);x.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<h;y+=4)x.fillRect(0,y,w,2)}
function reset(){run=1;t=score=dist=0;spd=.42;obs=[];spawn=0;px=target=0;E('msg').style.display='none';last=performance.now();music();requestAnimationFrame(loop)}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;t+=dt;spd=Math.min(1.05,.42+t*.009);score+=dt*(80+spd*130);dist+=dt*spd*.042;target=Math.max(-.82,Math.min(.82,Math.abs(touch)>.01?touch:(head-neutral)*sens/.28));px+=(target-px)*Math.min(1,dt*7.5);spawn-=dt;if(spawn<=0){obs.push({x:[-.62,0,.62][Math.floor(Math.random()*3)],z:.98,type:Math.random()>.35});spawn=Math.max(.52,1.45/(1+t/28))+Math.random()*.35}for(let o of obs){o.z-=spd*dt*.5;if(o.z<.17&&o.z>-.05&&Math.abs(o.x-px)<.23){run=0;best=Math.max(best,score);E('msg').textContent='CRASH! SCORE '+Math.floor(score)+' — PRESS RESTART';E('msg').style.display='block';noise(.35,.18);navigator.vibrate&&navigator.vibrate([120,50,160]);break}}obs=obs.filter(o=>o.z>-.12);hud();draw();if(run)requestAnimationFrame(loop)}
function results(r){fc.width=v.videoWidth||480;fc.height=v.videoHeight||640;fx.clearRect(0,0,fc.width,fc.height);if(r.multiFaceLandmarks&&r.multiFaceLandmarks.length){let L=r.multiFaceLandmarks[0],a=L[33],b=L[263];head=Math.atan2(b.y-a.y,b.x-a.x);drawConnectors(fx,L,FACEMESH_FACE_OVAL,{color:'#40f8ff',lineWidth:2});let s=Math.max(-1,Math.min(1,(head-neutral)*sens/.28));E('dot').style.left=(50+s*45)+'%';E('status').textContent='HEAD TRACKING ACTIVE'}else E('status').textContent='KEEP FACE VISIBLE'}
async function camera(){E('cam').disabled=true;try{mesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});mesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.65,minTrackingConfidence:.65});mesh.onResults(results);camObj=new Camera(v,{onFrame:async()=>mesh.send({image:v}),width:480,height:640,facingMode:'user'});await camObj.start();E('cam').textContent='CAMERA ACTIVE';E('status').textContent='FACE FOUND — CALIBRATE'}catch(e){E('cam').disabled=false;E('cam').textContent='TRY CAMERA AGAIN';E('status').textContent='CAMERA FAILED — USE TOUCH'}}
function initAudio(){if(audio){audio.resume();return}audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=+E('vol').value*.22;master.connect(audio.destination)}function tone(n,d,type='square',g=.1){if(!audio)return;let o=audio.createOscillator(),q=audio.createGain(),now=audio.currentTime;o.type=type;o.frequency.value=440*Math.pow(2,(n-69)/12);q.gain.setValueAtTime(.0001,now);q.gain.exponentialRampToValueAtTime(g,now+.008);q.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(q);q.connect(master);o.start();o.stop(now+d+.03)}function noise(d=.04,g=.05){if(!audio)return;let n=Math.floor(audio.sampleRate*d),b=audio.createBuffer(1,n,audio.sampleRate),D=b.getChannelData(0);for(let i=0;i<n;i++)D[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),q=audio.createGain();s.buffer=b;q.gain.value=g;s.connect(q);q.connect(master);s.start()}let mel=[76,79,83,88,83,79,76,71,74,78,81,86,81,78,74,69],bass=[40,43,36,38];function music(){initAudio();if(timer)return;timer=setInterval(()=>{tone(mel[step%mel.length],.11);if(step%2===0)tone(bass[Math.floor(step/4)%4],.18,'sawtooth',.055);if(step%4===2)noise(.03,.03);step++},125)}
E('cam').onclick=camera;E('cal').onclick=()=>{neutral=head;E('status').textContent='CALIBRATED — TILT TO STEER'};E('start').onclick=reset;for(const [id,val] of [['left',-1],['right',1]]){let b=E(id);b.onpointerdown=()=>touch=val;b.onpointerup=b.onpointercancel=b.onpointerleave=()=>touch=0}E('sens').oninput=e=>{sens=+e.target.value;E('sv').textContent=sens.toFixed(1)+'×'};E('vol').oninput=e=>{E('mv').textContent=Math.round(e.target.value*100)+'%';if(master)master.gain.value=+e.target.value*.22};addEventListener('resize',()=>{resize();draw()});resize();hud();draw();
</script></body></html>
